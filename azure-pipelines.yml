
trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetVersion)'

  - script: dotnet restore SmartHealthCare.slnx
    displayName: 'Restore NuGet packages'

  
  - script: |
      dotnet msbuild src/SmartHealthCare.API/SmartHealthCare.API.csproj -getItem:Compile > compile-items.json

      if grep -q '"Identity": "Program.cs"' compile-items.json; then
        echo "Program.cs IS included in compilation"
      else
        echo "Program.cs IS NOT included in compilation"
        grep -n "Program.cs" compile-items.json || true
      fi
    displayName: 'Check Program.cs compile inclusion'


  - script: dotnet build SmartHealthCare.slnx --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  - script: dotnet test SmartHealthCare.slnx --configuration $(buildConfiguration) --no-build --logger trx
    displayName: 'Run unit tests'
