
trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetVersion)'

  - script: dotnet restore SmartHealthCare.slnx
    displayName: 'Restore NuGet packages'

  - script: |
      echo "=== Program.cs ==="
      cat src/SmartHealthCare.API/Program.cs

      echo "=== API project settings ==="
      dotnet msbuild src/SmartHealthCare.API/SmartHealthCare.API.csproj \
        -getProperty:EnableDefaultCompileItems \
        -getProperty:OutputType \
        -getProperty:TargetFramework

      echo "=== Compile items ==="
      dotnet msbuild src/SmartHealthCare.API/SmartHealthCare.API.csproj \
        -getItem:Compile
    displayName: 'Diagnose API entry point'

  - script: dotnet build SmartHealthCare.slnx --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  - script: dotnet test SmartHealthCare.slnx --configuration $(buildConfiguration) --no-build --logger trx
    displayName: 'Run unit tests'
