
trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  apiProject: 'src/SmartHealthCare.API/SmartHealthCare.API.csproj'
  publishFolder: '$(Build.ArtifactStagingDirectory)/publish'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetVersion)'

  - script: dotnet restore SmartHealthCare.slnx
    displayName: 'Restore NuGet packages'

  - script: dotnet build SmartHealthCare.slnx --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  - script: dotnet test SmartHealthCare.slnx --configuration $(buildConfiguration) --no-build --logger trx
    displayName: 'Run unit tests'

  - script: >
      dotnet publish $(apiProject)
      --configuration $(buildConfiguration)
      --no-build
      --output $(publishFolder)
    displayName: 'Publish API'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: ArchiveFiles@2
    displayName: 'Package published API'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      rootFolderOrFile: '$(publishFolder)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/SmartHealthcareAPI.zip'
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: 'Deploy API to Azure App Service'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      azureSubscription: 'SmartHealthcare-Azure-Connection'
      appType: 'webAppLinux'
      appName: 'smarthealth-api-0602'
      package: '$(Build.ArtifactStagingDirectory)/SmartHealthcareAPI.zip'
