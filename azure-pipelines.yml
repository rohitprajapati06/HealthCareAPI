
trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetVersion)'

  - script: dotnet restore SmartHealthcareSystem.sln
    displayName: 'Restore NuGet packages'

  - script: dotnet build SmartHealthcareSystem.sln --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  - script: dotnet test SmartHealthcareSystem.sln --configuration $(buildConfiguration) --no-build --logger trx
    displayName: 'Run unit tests'
